<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="section" id="one">
        <form id="dropdown-form1" class="dropdown-form">
            <input type="text" id="task-input" placeholder="Target Task">
            <input type="text" id="user-input" placeholder="Target User">
            <input type="text" id="number-input" placeholder="Number of Actions">
            <button id="task-button" type="submit">Task Specification</button>
            <div id="text-result-1" style="margin-top: 30px;"></div>
        </form>
    </div>
    <div class="section" id="two">
        <form id="dropdown-form2" class="dropdown-form">
            <select class="variable-dropdown" id="variable-dropdown">
                <option value="1">1 task</option>
                <option value="2">2 tasks</option>
                <option value="3">3 tasks</option>
                <option value="4">4 tasks</option>
                <option value="5">5 tasks</option>
                <option value="6">6 tasks</option>
            </select>
            <select class="variable-dropdown" id="variable-dropdown2">
                <option value="any">Any</option>
                <option value="C">C</option>
                <option value="C#">C#</option>
                <option value="D">D</option>
                <option value="Db">Db</option>
                <option value="E">E</option>
                <option value="Eb">Eb</option>
                <option value="F">F</option>
                <option value="F#">F#</option>
                <option value="G">G</option>
                <option value="Gb">Gb</option>
                <option value="G#">G#</option>
                <option value="A">A</option>
                <option value="Ab">Ab</option>
                <option value="B">B</option>
                <option value="Bb">Bb</option>
            </select>
            <select class="variable-dropdown" id="variable-dropdown3">
                <option value="major or minor">Any</option>
                <option value="major">major</option>
                <option value="minor">minor</option>
            </select>
            <div id="dynamic-dropdown-container">
            </div>
            <button type="submit">Chord Progression</button>
            <input type="text" id="chord-input" placeholder="maj, min, aug, dim, 7th, 9th">
            <button id="get-notes-button">Note</button>
            <input type="text" id="notes-output" readonly>
            <button id="ask-button" type="submit">Note Arrangement</button>
            <div id="text-result-2" style="margin-top: 30px;"></div>
        </form>
    </div>
    </div>
    <div class="section" id="three">
        화이띵~
    </div>

    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tonal/browser/tonal.min.js"></script>
</body>
</html>
